<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>You are offline · FiscalHub</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background: linear-gradient(135deg, #eff6ff, #f5f3ff); color: #0f172a; }
    @media (prefers-color-scheme: dark) { body { background: linear-gradient(135deg, #020617, #1e1b4b); color: #e2e8f0; } .card { background: #0f172a; border-color: #1e293b; } p { color: #94a3b8 !important; } }
    .card { max-width: 420px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 40px 28px; box-shadow: 0 20px 50px -20px rgba(37, 99, 235, .35); }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { margin: 0 0 24px; line-height: 1.6; color: #475569; font-size: 15px; }
    button { font: inherit; font-weight: 600; background: #2563eb; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    small { display: block; margin-top: 18px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>You are offline</h1>
    <p>FiscalHub needs a connection to reach ZIMRA and your data. Check your internet, then try again. Nothing was lost: invoices already sent are safe.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script src="offline.js"></script>
</body>
</html>
